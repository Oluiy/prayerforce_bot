services:
  - type: web
    name: prayerforce-bot
    runtime: python
    plan: free
    rootDir: bot
    # Single worker: quiz sessions, admin grants and settings live in memory.
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt && PRISMA_BINARY_CACHE_DIR=/opt/render/project/src/bot prisma generate --schema=database/schema.prisma && PRISMA_BINARY_CACHE_DIR=/opt/render/project/src/bot prisma py fetch
    envVars:
      - key: PRISMA_BINARY_CACHE_DIR
        value: /opt/render/project/src/bot
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"
      # Generated by Render. Checked against Telegram's secret header.
      - key: WEBHOOK_SECRET
        generateValue: true
      # Secrets stay in the dashboard, not in git. Declared so recreating the
      # service (worker -> web) prompts for them instead of losing them.
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
